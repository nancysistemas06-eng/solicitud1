
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar incidencia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 550px;">

        <div class="card-body p-4">

            <h3 class="text-danger mb-3">
                Confirmar eliminación
            </h3>

            <p>
                ¿Estás segura de que deseas eliminar esta incidencia?
            </p>

            <div class="alert alert-warning">

                <strong>Folio:</strong> {{ incidencia.folio }}<br>

                <strong>Título:</strong> {{ incidencia.titulo }}<br>

                <strong>Sucursal:</strong> {{ incidencia.sucursal.nombre }}

            </div>

            <p class="text-danger small">
                Esta acción es permanente y también eliminará los seguimientos asociados.
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sí, eliminar incidencia
                </button>

                <a href="{% url 'administrar_incidencias' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
